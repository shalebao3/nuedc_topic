name: Import NUEDC 1994-2007 problems

on:
  push:
    branches:
      - chore/import-nuedc-1994-2007
    paths:
      - .github/workflows/import-old-problems.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: chore/import-nuedc-1994-2007
          fetch-depth: 0

      - name: Download problem PDFs from nuedc.org
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          import time

          files = [
              ("1994_A题_简易数控直流电源.pdf", "1994/A_简易数控直流电源.pdf"),
              ("1994_B题_多路数据采集系统.pdf", "1994/B_多路数据采集系统.pdf"),
              ("1995_A题_实用低频功率放大器.pdf", "1995/A_实用低频功率放大器.pdf"),
              ("1995_B题_实用信号源的设计和制作.pdf", "1995/B_实用信号源的设计和制作.pdf"),
              ("1995_C题_简易无线电遥控系统.pdf", "1995/C_简易无线电遥控系统.pdf"),
              ("1995_D题_简易电阻_电容和电感测试仪.pdf", "1995/D_简易电阻_电容和电感测试仪.pdf"),
              ("1997_A题_直流稳定电源.pdf", "1997/A_直流稳定电源.pdf"),
              ("1997_B题_简易数字频率计.pdf", "1997/B_简易数字频率计.pdf"),
              ("1997_C题_水温控制系统.pdf", "1997/C_水温控制系统.pdf"),
              ("1997_D题_调幅广播收音机.pdf", "1997/D_调幅广播收音机.pdf"),
              ("1999_A题_测量放大器.pdf", "1999/A_测量放大器.pdf"),
              ("1999_B题_数字式工频有效值多用表.pdf", "1999/B_数字式工频有效值多用表.pdf"),
              ("1999_C题_频率特性测试仪.pdf", "1999/C_频率特性测试仪.pdf"),
              ("1999_D题_短波调频接收机.pdf", "1999/D_短波调频接收机.pdf"),
              ("1999_E题_数字化语音存储与回放系统.pdf", "1999/E_数字化语音存储与回放系统.pdf"),
              ("2001_A题_波形发生器.pdf", "2001/A_波形发生器.pdf"),
              ("2001_B题_简易数字存储示波器.pdf", "2001/B_简易数字存储示波器.pdf"),
              ("2001_C题_自动往返电动小汽车.pdf", "2001/C_自动往返电动小汽车.pdf"),
              ("2001_D题_高效率音频功率放大器.pdf", "2001/D_高效率音频功率放大器.pdf"),
              ("2001_E题_数据采集与传输系统.pdf", "2001/E_数据采集与传输系统.pdf"),
              ("2001_F题_调频收音机.pdf", "2001/F_调频收音机.pdf"),
              ("2003_A题_电压控制LC振荡器.pdf", "2003/A_电压控制LC振荡器.pdf"),
              ("2003_B题_宽带放大器.pdf", "2003/B_宽带放大器.pdf"),
              ("2003_C题_低频数字式相位测量仪.pdf", "2003/C_低频数字式相位测量仪.pdf"),
              ("2003_D题_简易逻辑分析仪.pdf", "2003/D_简易逻辑分析仪.pdf"),
              ("2003_E题_简易智能电动车.pdf", "2003/E_简易智能电动车.pdf"),
              ("2003_F题_液体点滴速度监控装置.pdf", "2003/F_液体点滴速度监控装置.pdf"),
              ("2005_A题_正弦信号发生器.pdf", "2005/A_正弦信号发生器.pdf"),
              ("2005_B题_集成运放参数测试仪.pdf", "2005/B_集成运放参数测试仪.pdf"),
              ("2005_C题_简易频谱分析仪.pdf", "2005/C_简易频谱分析仪.pdf"),
              ("2005_D题_单工无线呼叫系统.pdf", "2005/D_单工无线呼叫系统.pdf"),
              ("2005_E题_悬挂运动控制系统.pdf", "2005/E_悬挂运动控制系统.pdf"),
              ("2005_F题_数控直流电流源.pdf", "2005/F_数控直流电流源.pdf"),
              ("2005_G题_三相正弦波变频电源.pdf", "2005/G_三相正弦波变频电源.pdf"),
              ("2007_A题_音频信号分析仪.pdf", "2007/A_音频信号分析仪.pdf"),
              ("2007_B题_无线识别装置.pdf", "2007/B_无线识别装置.pdf"),
              ("2007_C题_数字示波器.pdf", "2007/C_数字示波器.pdf"),
              ("2007_D题_程控滤波器.pdf", "2007/D_程控滤波器.pdf"),
              ("2007_E题_开关稳压电源.pdf", "2007/E_开关稳压电源.pdf"),
              ("2007_F题_电动车跷跷板.pdf", "2007/F_电动车跷跷板.pdf"),
              ("2007_G题_积分式直流数字电压表.pdf", "2007/G_积分式直流数字电压表.pdf"),
              ("2007_H题_信号发生器.pdf", "2007/H_信号发生器.pdf"),
              ("2007_I题_可控放大器.pdf", "2007/I_可控放大器.pdf"),
              ("2007_J题_电动车跷跷板.pdf", "2007/J_电动车跷跷板.pdf"),
          ]

          base = "https://nuedc.org/problems/"
          for source, destination in files:
              dest = Path(destination)
              dest.parent.mkdir(parents=True, exist_ok=True)
              url = base + quote(source, safe="")
              last_error = None
              for attempt in range(1, 4):
                  try:
                      req = Request(url, headers={"User-Agent": "nuedc-topic-import/1.0"})
                      with urlopen(req, timeout=60) as response:
                          data = response.read()
                      if not data.startswith(b"%PDF-"):
                          raise RuntimeError(f"{source}: response is not a PDF")
                      dest.write_bytes(data)
                      print(f"OK {source} -> {destination} ({len(data)} bytes)")
                      break
                  except Exception as exc:
                      last_error = exc
                      if attempt == 3:
                          raise
                      time.sleep(attempt * 2)
              else:
                  raise last_error

          if len(files) != 44:
              raise RuntimeError(f"expected 44 files, got {len(files)}")
          PY

      - name: Verify and commit
        shell: bash
        run: |
          set -euo pipefail
          actual="$(find 1994 1995 1997 1999 2001 2003 2005 2007 -type f -name '*.pdf' | wc -l | tr -d ' ')"
          test "$actual" = "44"
          git status --short
          git config user.name "github-actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 1994 1995 1997 1999 2001 2003 2005 2007
          git commit -m "docs: add NUEDC problems for 1994-2007"
          git push origin HEAD:chore/import-nuedc-1994-2007
